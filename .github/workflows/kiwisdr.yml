name: KiwiSDR Live FT8 Reception ($0)

# REAL off-air FT8 reception on GitHub's free runners.
# Why here and not in the sandbox VM: the sandbox denies direct TCP, so the
# KiwiSDR audio websocket can never connect there (see lab/results/kiwisdr_test.log).
# GitHub-hosted runners have unrestricted outbound TCP/websocket access, so
# kiwirecorder can pull live audio from public KiwiSDR receivers and ft8_lib
# (built from source) decodes whatever real FT8 signals are on the band.
# Manual trigger only (workflow_dispatch). Results are committed back to
# lab/results/kiwisdr_ci.log. Zero decodes is a valid, honestly-logged result.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kiwisdr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 + install deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pypng pyyaml

      - name: Clone kiwiclient (KiwiSDR recorder)
        run: git clone --depth 1 https://github.com/jks-prv/kiwiclient /tmp/kiwiclient

      - name: Clone + build ft8_lib (from source)
        run: |
          if [ ! -d lab/ft8_lib ]; then
            git clone --depth 1 https://github.com/kgoba/ft8_lib lab/ft8_lib
          fi
          cd lab/ft8_lib && make

      - name: Record live audio from a public KiwiSDR + decode FT8
        id: record
        timeout-minutes: 17
        shell: bash
        run: |
          set +e
          mkdir -p lab/results /tmp/kiwi_rec
          LOG="lab/results/kiwisdr_ci.log"
          REC_DIR="/tmp/kiwi_rec"
          {
            echo "=== KiwiSDR Live FT8 Reception - GitHub Actions (zero-dollar) ==="
            echo "Run start (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Method: kiwirecorder.py (jks-prv/kiwiclient) -> WAV -> UTC-slot-aligned decode (lab/ft8_slot_decode.py, ft8_lib decode_ft8 per 15 s UTC slot, each slot once)"
            echo "Hosts (verified live 2026-10-20, source: lab/results/kiwisdr_test.log), tried in order:"
            echo "  1. emeraldsdr.ddns.net:8073          Carlow, Ireland (Europe)"
            echo "  2. dxcentral.proxy.kiwisdr.com:8073  Mandeville, LA, USA (North America)"
            echo "  3. 22537.proxy.kiwisdr.com:8073      Esk, Queensland, Australia (Oceania)"
            echo "  4. bachner.proxy.kiwisdr.com:8073    London, Ontario, Canada (North America)"
            echo "Frequencies per host, in order: 14074 kHz, then 7074 kHz (USB, passband 200-3000 Hz)"
          } > "$LOG"

          HOSTS=(
            "emeraldsdr.ddns.net:8073|Carlow, Ireland (Europe)"
            "dxcentral.proxy.kiwisdr.com:8073|Mandeville, LA, USA (North America)"
            "22537.proxy.kiwisdr.com:8073|Esk, Queensland, Australia (Oceania)"
            "bachner.proxy.kiwisdr.com:8073|London, Ontario, Canada (North America)"
          )
          FREQS="14074 7074"
          TLIMIT=90
          MIN_BYTES=102400
          DEADLINE=$(( $(date +%s) + 840 ))

          WAV=""; USED_HOST=""; USED_FREQ=""; REC_START_UTC=""
          for entry in "${HOSTS[@]}"; do
            hp="${entry%%|*}"; label="${entry##*|}"; host="${hp%%:*}"; port="${hp##*:}"
            for freq in $FREQS; do
              if [ "$(date +%s)" -gt "$DEADLINE" ]; then
                echo "Recording time budget (14 min) reached; no further attempts." >> "$LOG"
                break 2
              fi
              tag="$(echo "$host" | cut -d. -f1)_${freq}"
              attempt_start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "" >> "$LOG"
              echo "--- Attempt: $host:$port ($label) freq=${freq} kHz USB passband 200-3000 Hz tlimit=${TLIMIT}s start_utc=${attempt_start} ---" >> "$LOG"
              ( cd /tmp/kiwiclient && timeout 150 python3 kiwirecorder.py \
                  -s "$host" -p "$port" -f "$freq" -m usb -L 200 -H 3000 \
                  --tlimit "$TLIMIT" --resample 12000 \
                  -d "$REC_DIR" --fn "rec_$tag" -u "nature-mirror-mesh-ci" ) >> "$LOG" 2>&1
              echo "kiwirecorder exit code: $?" >> "$LOG"
              cand="$REC_DIR/rec_$tag.wav"
              if [ -f "$cand" ]; then
                sz=$(stat -c%s "$cand")
                echo "Produced WAV: $cand (${sz} bytes)" >> "$LOG"
                if [ "$sz" -gt "$MIN_BYTES" ]; then
                  WAV="$cand"; USED_HOST="$host:$port ($label)"; USED_FREQ="$freq"
                  REC_START_UTC="$attempt_start"
                  echo "Selected recording: $WAV" >> "$LOG"
                  break 2
                fi
              else
                echo "No WAV file produced by this attempt." >> "$LOG"
              fi
            done
          done

          echo "" >> "$LOG"
          if [ -z "$WAV" ]; then
            {
              echo "RESULT: NO USABLE RECORDING - every host/frequency attempt failed or produced <= ${MIN_BYTES} bytes."
              echo "Total FT8 decodes: 0 (nothing to decode). Zero is a result, not a crash."
            } >> "$LOG"
            echo "wav_found=false" >> "$GITHUB_OUTPUT"
            cat "$LOG"
            exit 0
          fi

          cp "$WAV" ./kiwisdr_recording.wav
          echo "wav_found=true" >> "$GITHUB_OUTPUT"

          # UTC-slot-aligned decode (audit fix 2026-10-20): each 15 s
          # FT8 slot is decoded exactly once by lab/ft8_slot_decode.py,
          # aligned to the true UTC slot grid using the recording start
          # captured at the selected attempt. (The old 2 s-stride
          # slicing triple-decoded transmissions, merged repeats across
          # slots by text, and silently missed the final slot.)
          {
            echo ""
            echo "=== Decode phase ==="
            echo "Recording: $WAV host=$USED_HOST freq=$USED_FREQ kHz USB"
            echo "Recording start used for slot alignment: $REC_START_UTC"
            echo "NOTE: this is the attempt banner timestamp; the audit of run 39389957321"
            echo "found the first audio sample lags it by ~1.6-2.4 s (kiwirecorder connect"
            echo "latency), so slot attribution is exact but DT values carry that offset."
          } >> "$LOG"
          SLOT_OUT="/tmp/slot_decode_out.txt"
          python3 lab/ft8_slot_decode.py "$WAV" "$REC_START_UTC" \
              --decode-ft8 lab/ft8_lib/decode_ft8 > "$SLOT_OUT" 2> /tmp/slot_decode.err
          slot_rc=$?
          cat "$SLOT_OUT" >> "$LOG"
          if [ "$slot_rc" -ne 0 ]; then
            echo "ft8_slot_decode.py exited $slot_rc; stderr:" >> "$LOG"
            cat /tmp/slot_decode.err >> "$LOG"
          fi
          {
            echo ""
            echo "=== SUMMARY ==="
            echo "Host used: $USED_HOST, frequency: $USED_FREQ kHz USB"
            grep "^# Unique (slot, text) messages:" "$SLOT_OUT" | sed 's/^# //'
            grep -cE "^[0-9]{4}-[0-9]{2}-[0-9]{2}T" "$SLOT_OUT" | sed 's/^/Decoded message lines listed above: /'
            echo "NOTE: a decode's approximate UTC = its slot UTC + DT column."
          } >> "$LOG"
          echo "Record+decode step finished." >> "$LOG"
          cat "$LOG"

      - name: Upload recording + log as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwisdr-reception
          path: |
            kiwisdr_recording.wav
            lab/results/kiwisdr_ci.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit results log back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/results/kiwisdr_ci.log
          if git diff --cached --quiet; then
            echo "Results log unchanged; nothing to commit."
          else
            git commit -m "KiwiSDR CI reception results [skip ci]"
            git push
          fi
